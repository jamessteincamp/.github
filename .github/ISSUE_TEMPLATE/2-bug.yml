name: Bug
description: Something that used to work doesn’t, or does something odd.
type: Bug
assignees: ["jamessteincamp"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, in order.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Copy any error message exactly, or add a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
